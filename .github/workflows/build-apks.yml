name: Build & Release KRAVE Mobile APKs

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_target:
        description: 'App target to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - customer
          - kds
          - rider
          - owner

permissions:
  contents: write

jobs:
  build-apks:
    name: Build Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🦋 Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: ⚙️ Verify Flutter Environment
        run: flutter doctor -v

      - name: 🛠️ Initialize Android Platform Files
        working-directory: ./flutter_app
        run: |
          if [ ! -d "android" ]; then
            echo "Generating Android scaffold..."
            flutter create . --org pk.krave --platforms=android
          fi

      - name: 📦 Install Flutter Dependencies
        working-directory: ./flutter_app
        run: flutter pub get

      - name: 📱 Build Customer Storefront APK
        if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'customer' || github.event_name == 'push' || github.event_name == 'pull_request' }}
        working-directory: ./flutter_app
        run: |
          echo "Building Customer Storefront APK..."
          flutter build apk -t lib/apps/customer/main_customer.dart --release
          mkdir -p ../dist-apks
          cp build/app/outputs/flutter-apk/app-release.apk ../dist-apks/krave-customer-app-release.apk

      - name: 📟 Build Kitchen Display (KDS) APK
        if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'kds' || github.event_name == 'push' || github.event_name == 'pull_request' }}
        working-directory: ./flutter_app
        run: |
          echo "Building Kitchen KDS Tablet APK..."
          flutter build apk -t lib/apps/kds/main_kds.dart --release
          mkdir -p ../dist-apks
          cp build/app/outputs/flutter-apk/app-release.apk ../dist-apks/krave-kitchen-kds-release.apk

      - name: 🛵 Build Rider Courier Fleet APK
        if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'rider' || github.event_name == 'push' || github.event_name == 'pull_request' }}
        working-directory: ./flutter_app
        run: |
          echo "Building Rider Courier Fleet APK..."
          flutter build apk -t lib/apps/rider/main_rider.dart --release
          mkdir -p ../dist-apks
          cp build/app/outputs/flutter-apk/app-release.apk ../dist-apks/krave-rider-fleet-release.apk

      - name: 📊 Build Merchant Owner OS APK
        if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'owner' || github.event_name == 'push' || github.event_name == 'pull_request' }}
        working-directory: ./flutter_app
        run: |
          echo "Building Merchant Owner OS APK..."
          flutter build apk -t lib/apps/owner/main_owner.dart --release
          mkdir -p ../dist-apks
          cp build/app/outputs/flutter-apk/app-release.apk ../dist-apks/krave-merchant-os-release.apk

      - name: 📋 Check Generated APK Artifacts
        run: ls -lh dist-apks/

      - name: ☁️ Upload Downloadable APKs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: krave-commerce-os-apks
          path: dist-apks/*.apk
          retention-days: 90

      - name: 🚀 Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-apks/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
